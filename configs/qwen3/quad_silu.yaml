# Quadratic fitted to **SiLU** as Qwen3's SwiGLU activation, full depth + range penalty.
#
# THE primary op experiment. a=0.0752 b=0.4313 c=0.1970, least-squares over 38M measured gate_proj
# samples restricted to |x| <= 16 — fit where the mass is, and only inside the domain the penalty
# enforces (a fit over the full observed range, max 319, is dragged nearly linear by the tails and gets
# *worse* in the bulk). Bulk RMSE 0.222 vs 0.924 for MPCFormer's quad, at identical FHE cost.
#
# domain 16 is the sweet spot: only 0.023% of current pre-activations exceed it, so the penalty has an
# easy target, and the fit is as good as at domain 8 while bounding the output to ~26.
# ⚠️ Output dynamic range is dominated by the INPUT tails, not the coefficients — unpenalized, real data
# drives the output to ~9000 under either fit. The penalty is the lever for FHE scale; the coefficients
# are the lever for accuracy. They are independent.
#
# Init recall@10 is 0.0340 (cos 0.028), worse than any depth cut — but init has been non-predictive at
# every previous test in this project, so it is not evidence about the outcome.

model:
  backend: qwen3
  num_hidden_layers: 28 # FULL depth on purpose — isolate the op's cost from the depth lever

  softmax: exact # exact softmax on purpose; cgf comes later, one lever at a time
  softmax_kwargs: {}
  activation: quad_silu
  activation_kwargs: {domain: 16}

distill:
  # beta 1.0, NOT the 10.0 that BERT's quad needed. That value existed to make hidden alignment
  # compete with CE/KL; this task has no logits, and Qwen3's massive activations (|h| up to 6207)
  # already make hidden MSE 26,000x the bounded (1-cos) embed term at init. Raising beta would only
  # shrink the embed term further and dilute the range penalty tenfold.
  beta: 1.0
  hidden_layer_map: null # identity at full depth
  range_penalty: 1.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 24000
  output_dir: outputs
  run_name: qwen3_quad_silu
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5
    # 6 epochs, double the standard 3: init recall@10 is 0.034 (cos 0.02, essentially orthogonal to
    # the teacher), a far bigger perturbation than any depth cut, and quad is documented as slow to
    # train. The depth-28 control showed extra epochs add no drift, so this cannot flatter the result.
    epochs: 6
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
