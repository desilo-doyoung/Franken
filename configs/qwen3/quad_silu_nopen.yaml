# quad_silu with the range penalty OFF — isolates what the penalty costs and what it buys.
#
# Identical to quad_silu.yaml except `range_penalty: 0` and no `domain`, so nothing constrains the
# pre-activations. Expect BETTER recall (the penalty spends model capacity fighting the network's
# natural activation range) and MUCH worse FHE viability: unpenalized, the quad output reaches ~9000 on
# real data versus ~26 if the penalty holds inputs inside +-16. That trade is the whole question — a
# cheap op is worthless if its dynamic range forces extra bootstrapping.
#
# Without this run, "quad_silu + penalty scored X" cannot be split into the op's cost and the penalty's.

model:
  backend: qwen3
  num_hidden_layers: 28 # FULL depth on purpose — isolate the op's cost from the depth lever

  softmax: exact # exact softmax on purpose; cgf comes later, one lever at a time
  softmax_kwargs: {}
  activation: quad_silu
  activation_kwargs: {}

distill:
  # beta 1.0, NOT the 10.0 that BERT's quad needed. That value existed to make hidden alignment
  # compete with CE/KL; this task has no logits, and Qwen3's massive activations (|h| up to 6207)
  # already make hidden MSE 26,000x the bounded (1-cos) embed term at init. Raising beta would only
  # shrink the embed term further and dilute the range penalty tenfold.
  beta: 1.0
  hidden_layer_map: null # identity at full depth
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 24000
  output_dir: outputs
  run_name: qwen3_quad_silu_nopen
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5
    # 6 epochs, double the standard 3: init recall@10 is 0.034 (cos 0.02, essentially orthogonal to
    # the teacher), a far bigger perturbation than any depth cut, and quad is documented as slow to
    # train. The depth-28 control showed extra epochs add no drift, so this cannot flatter the result.
    epochs: 6
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
