# DATA SCALING at depth 14 (half the layers) — is the ~15% recall gap a capacity limit or a data limit?
#
# 3x unique data at identical steps.
#
# All three runs in this ladder hold OPTIMIZER STEPS FIXED at 6750 (corpus/32 * epochs) with the same
# warmup and LR schedule, and vary only how much UNIQUE text those steps see: 24k / 72k / 216k. That
# separates data diversity from optimization budget, which "just train longer" would confound.
#
# Motivation: every run in this project generalizes worse than it trains, and the gap is biggest for the
# BEST models (quad_silu_nopen train embed 0.011 vs eval 0.0260, +136%; depth 14 +39%) — the signature
# of a data limit, since a capacity limit would show small gaps everywhere. Context: 24k texts x 3ep is
# ~6.5M tokens seen, about 0.1% of the corpus DistilBERT used for the "97% with half the layers" result
# that motivates expecting much better than 0.8140 here.
#
# ⚠️ Ceiling reminder: the depth-28 control reaches only 0.9648, so "97% of the teacher" is unreachable
# with this recipe regardless of data — 97% of what is achievable is ~0.936.
# ⚠️ Runs with more epochs get more checkpoint-selection chances. Recall has been monotone in every run
# so far, so the last epoch wins anyway, but it is a small bias in favour of the 9-epoch run.
model:
  backend: qwen3
  num_hidden_layers: 14 # halves every per-layer FHE cost

  softmax: exact # exact ops on purpose — isolate the cost of depth
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  beta: 1.0
  # Removes teacher layers 6-19. ⚠️ Picked by the zero-training block scan, which trained testing at
  # depth 19 later refuted — the exact middle (7-20 here) beat every scanned alternative. This map is
  # one block early, worth maybe ~0.5 pt by the depth-19 shift cost; the recorded 0.8140 used it.
  hidden_layer_map: [0, 1, 2, 3, 4, 5, 20, 21, 22, 23, 24, 25, 26, 27]
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 72000
  output_dir: outputs
  run_name: qwen3_depth14_data72k
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32 # standard recipe (fidelity-verified against fp32 at depth 24)

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5 # sqrt scaling for bs32; must match the other depth runs or the comparison breaks
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
