# multi_domain ladder, baseline arm: full teacher depth, exact ops, no penalty.
# The student is mathematically the teacher, so this measures the TRAINING change alone (new corpus,
# 1024 tokens, token-budgeted batching). Anything that drops here is the setup, not the architecture,
# and invalidates the other two arms. Also the config to run the identity self-tests under.
# See depth19_quad.yaml for the shared setup.

model:
  backend: qwen3
  num_hidden_layers: 28 # full teacher depth — no reduction in the baseline

  softmax: exact
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}
  attn_impl: sdpa_causal

distill:
  beta: 1.0
  hidden_layer_map: null # null -> auto uniform stride; identity at 28
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: multi_domain
  # v8 mix (pubmed -> arxiv) measures 110.3 tok/text: 2.01B token-passes over 2 epochs.
  corpus_size: 9100000
  output_dir: outputs
  run_name: qwen3_depth28_exact
  max_seq_len: 1024
  seed: 42
  device: cuda
  precision: bf16
  compile: true

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 3.4e-5
    epochs: 2
    token_budget: 16384 # per RANK, measured at depth 28
    max_seqs: 256
    warmup_ratio: 0.1
    weight_decay: 0.01
