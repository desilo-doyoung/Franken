# multi_domain ladder, baseline arm: full teacher depth, exact ops, no penalty.
# The student is mathematically the teacher, so this measures the TRAINING change alone (new corpus,
# 1024 tokens, token-budgeted batching). Anything that drops here is the setup, not the architecture,
# and invalidates the other two arms. Also the config to run the identity self-tests under.
# See depth19_quad.yaml for the shared setup.

# ⚠️ 2026-08-19 rebase: 2.0 Gtok seen ONCE, global tokens_per_step, lr derived. Does not reproduce
#    the archived control.

model:
  backend: qwen3
  num_hidden_layers: 28 # full teacher depth — no reduction in the baseline

  softmax: exact
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}
  attn_impl: sdpa_causal

distill:
  beta: 1.0
  hidden_layer_map: null # null -> auto uniform stride; identity at 28
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: multi_domain
  tokens_per_epoch: 2_000_000_000 # unique tokens; seen once, not 1.0 Gtok twice
  output_dir: outputs
  run_name: qwen3_depth28_exact
  max_seq_len: 1024
  seed: 42
  device: cuda
  precision: bf16
  compile: true

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: null # sqrt-batch from trainer.BASE_LR; 3.4e-5 was set for a retired batch
    epochs: 1
    tokens_per_step: 32_768 # GLOBAL tokens per optimizer step
    warmup_ratio: 0.1
    weight_decay: 0.01
