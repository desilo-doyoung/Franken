# depth 14 / exact SiLU, no penalty / token_budget 8192 per rank.
# Pairs with d14_quad_tb8192.yaml (ops lever) and the other budgets at this depth.

model:
  backend: qwen3
  num_hidden_layers: 14

  softmax: exact
  softmax_kwargs: {}
  activation: silu # Qwen3's SwiGLU nonlinearity is SiLU, NOT GELU
  activation_kwargs: { domain: 32 }  # unused by exact silu
  attn_impl: sdpa_causal

distill:
  beta: 1.0
  hidden_layer_map: [0, 1, 2, 3, 4, 5, 6, 21, 22, 23, 24, 25, 26, 27]
  range_penalty: 0.0 # exact SiLU has no bounded domain to squash into
  range_penalty_layers: null # every layer

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: multi_domain
  # v8 mix (pubmed -> arxiv) measures 110.3 tok/text: 2.01B token-passes over 2 epochs.
  corpus_size: 9100000
  output_dir: outputs
  run_name: qwen3_d14_exact_tb8192
  max_seq_len: 1024
  seed: 42
  device: cuda
  precision: bf16
  compile: true

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    # null, NOT hardcoded: the budget axis moves the global batch 8x, and one fixed lr would make
    # this a sweep of how undertrained the big-batch arms are.
    lr: null
    epochs: 2
    token_budget: 8192
    max_seqs: 128
    warmup_ratio: 0.1
    weight_decay: 0.01
