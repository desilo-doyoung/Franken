# Depth 14, PER-LAYER RELATIVE hidden loss, beta=100 — fixing the distillation objective itself.
#
# Diagnosis (measured on a seeded depth-14 student): with raw MSE the teacher's per-layer mean square
# spans 11,085x (0.07 .. 808), the loss share rises monotonically with depth, and the FINAL layer — the
# one the pooled embedding is computed from — receives just 2.7% of the weight while carrying the worst
# relative error (relMSE 1.12 vs 0.05-0.15 elsewhere), because the final RMSNorm leaves its magnitude
# small. We were optimizing whichever layers happened to have large activations.
#
# `hidden_loss: relative` divides each layer's MSE by that layer's teacher mean square, equalizing
# layers and rescaling the term from O(10) to O(0.1) — which is what makes beta a real knob. At init,
# hidden/embed goes from 59:1 (raw) to 0.2:1, so the hidden share becomes 17% at beta=1, 68% at 10,
# 95% at 100.
#
# beta=100: hidden-dominated (95%%), i.e. roughly the SAME embed/hidden balance as raw MSE but with
# layers equalized. This isolates layer-equalization alone from the change in the embed/hidden ratio —
# without it, a win at beta=1 or 10 could not be attributed to either cause.
#
# Baseline to beat: `depth14_data72k` (raw MSE, beta 1) = recall@10 0.8360 at identical data/steps.
model:
  backend: qwen3
  num_hidden_layers: 14 # halves every per-layer FHE cost

  softmax: exact # exact ops on purpose — isolate the cost of depth
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  hidden_loss: relative
  beta: 100.0
  # Removes teacher layers 6-19. ⚠️ Picked by the zero-training block scan, which trained testing at
  # depth 19 later refuted — the exact middle (7-20 here) beat every scanned alternative. This map is
  # one block early, worth maybe ~0.5 pt by the depth-19 shift cost; the recorded 0.8140 used it.
  hidden_layer_map: [0, 1, 2, 3, 4, 5, 20, 21, 22, 23, 24, 25, 26, 27]
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 72000
  output_dir: outputs
  run_name: qwen3_depth14_rel_b100
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32 # standard recipe (fidelity-verified against fp32 at depth 24)

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5 # sqrt scaling for bs32; must match the other depth runs or the comparison breaks
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
