# Depth 14, MAXIMUM data AND 3x steps — the one untested cell of the scaling grid.
#
# The earlier ladder held steps fixed at 6,750 and varied unique data 24k/72k/216k, concluding "data
# saturates". ⚠️ That conclusion was too strong: 6,750 steps x batch 32 = 216,000 samples, so a 216k
# corpus means each example is seen EXACTLY ONCE — 216k was the maximum unique data that budget could
# consume, not an arbitrary top rung. All the ladder established is that at FIXED compute, 3 passes over
# 72k ~= 1 pass over 216k.
#
# Data and steps are coupled: using more unique text requires more steps to consume it. Isolated, 3x
# steps at fixed data gave +1.34 pts and 3x data at fixed steps gave +0.86. This run scales BOTH:
# 216k x 3ep = 20,250 steps, ~58M tokens seen (3x the previous best), with the best loss setting
# (relative, beta 1).
#
# Baseline to beat: `depth14_rel_b1` (72k x 3ep, 6,750 steps) = 0.8436.
# If the two effects are additive, expect ~0.866 and the trend is still climbing — which would make the
# "the depth-14 gap is architectural" verdict premature. If it lands ~0.85, capacity is confirmed.
# ⚠️ Even 58M tokens is ~50x short of the ~3B DistilBERT used for its "97% with half the layers" figure,
# so a flat result here bounds the data hypothesis rather than fully closing it.
model:
  backend: qwen3
  num_hidden_layers: 14 # halves every per-layer FHE cost

  softmax: exact # exact ops on purpose — isolate the cost of depth
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  hidden_loss: relative
  beta: 1.0
  # Removes teacher layers 6-19. ⚠️ Picked by the zero-training block scan, which trained testing at
  # depth 19 later refuted — the exact middle (7-20 here) beat every scanned alternative. This map is
  # one block early, worth maybe ~0.5 pt by the depth-19 shift cost; the recorded 0.8140 used it.
  hidden_layer_map: [0, 1, 2, 3, 4, 5, 20, 21, 22, 23, 24, 25, 26, 27]
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 216000
  output_dir: outputs
  run_name: qwen3_depth14_max
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32 # standard recipe (fidelity-verified against fp32 at depth 24)

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5 # sqrt scaling for bs32; must match the other depth runs or the comparison breaks
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
