# [3/5] Degree-2 activation, UNPENALIZED, at full depth — the op lever in isolation.
#
# quad_silu is a*x^2+b*x+c least-squares fitted to SiLU on 38M measured gate_proj samples (bulk RMSE
# 0.222 vs 0.924 for MPCFormer's GELU quad). Degree 2 everywhere, so it never explodes out of domain:
# nothing breaks without a penalty, only the OUTPUT dynamic range is unbounded (~9000, driven by input
# tails rather than the coefficients). That is an FHE scale-budget problem, not an accuracy one — which
# is what [4] measures.
#
# Batch recipe shared with [1]. FHE cost: mult-depth 1, saving ~5 levels per layer vs exact SiLU.

model:
  backend: qwen3
  num_hidden_layers: 28

  softmax: exact # isolate the activation; cgf is a separate lever
  softmax_kwargs: {}
  activation: quad_silu
  activation_kwargs: {} # no domain => nothing to penalize

distill:
  beta: 1.0
  hidden_layer_map: null
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 2100000
  output_dir: outputs
  run_name: qwen3_quad_silu_nopen_max
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: bf16
  compile: true

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 6.93e-5
    epochs: 3
    batch_size: 384
    warmup_ratio: 0.1
    weight_decay: 0.01
