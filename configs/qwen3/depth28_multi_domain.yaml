# multi_domain ladder, baseline arm: full teacher depth, exact ops, no penalty.
# The student is mathematically the teacher, so this measures the TRAINING change alone (new corpus,
# 1024 tokens, token-budgeted batching). Anything that drops here is the setup, not the architecture,
# and invalidates the other two arms. Also the config to run the identity self-tests under.
# See depth19_multi_domain.yaml for the shared setup.

model:
  backend: qwen3
  num_hidden_layers: 28 # full teacher depth — no reduction in the baseline

  softmax: exact
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}
  attn_impl: sdpa_causal

distill:
  beta: 1.0
  hidden_layer_map: null # null -> auto uniform stride; identity at 28
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: multi_domain
  # Probe said 111.3 tok/text; the built corpus realized 107.7, so this spends 1.94B, not 2B.
  # Left as-is on purpose: 9,300,000 would hit 2.00B but is a different cache key, and every
  # rung of this ladder shares this one. Change it only when starting a fresh ladder.
  corpus_size: 9000000
  output_dir: outputs
  run_name: qwen3_depth28_multi_domain
  max_seq_len: 1024
  seed: 42
  device: cuda
  precision: bf16
  compile: true

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    # null = sqrt-batch scaled from the tuned reference; the trainer logs the value.
    lr: null
    epochs: 3
    token_budget: 16384 # per RANK, measured at depth 28
    max_seqs: 256
    warmup_ratio: 0.1
    weight_decay: 0.01
