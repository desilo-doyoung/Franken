# Depth 8, exact ops — 71% of layers removed. Where the floor finally starts to appear.
#
# RESULT: recall@10 0.7486, STS-B 0.8130 (-6.9% relative), from an init of just 0.18 (72% recovery).
# Two signs of an approaching limit: per-layer cost rose to 0.0123 (from ~0.0094 across 24->11), and
# STS-B broke its plateau for the first time since depth 24 (-0.0134 vs depth 11, clearing the noise
# band). Still usable — and a 3.5x cut in multiplicative depth, the dominant FHE cost.
#
# Map is the middle block; at this depth "keep the ends" nearly determines it anyway.
#
#   distill: uv run python main.py distill --config configs/qwen3/depth8.yaml

model:
  backend: qwen3
  num_hidden_layers: 8

  softmax: exact # exact ops on purpose — isolate the cost of depth
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  beta: 1.0
  hidden_layer_map: [0, 1, 2, 3, 24, 25, 26, 27]
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 24000
  output_dir: outputs
  run_name: qwen3_depth8
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
