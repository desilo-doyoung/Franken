# Depth 14, exact ops — the headline halving (50% of layers removed).
#
# RESULT: recall@10 0.8140, STS-B 0.8373 (-4.1% relative). Note the dissociation: 5 more layers gone
# than depth 19 cost 4.9 points of teacher-fidelity but ZERO absolute quality (STS-B is inside its
# +/-0.011 noise band vs depth 19's 0.8361). Recall tracks the teacher's neighbourhoods; STS-B tracks
# coarse semantics, and depth cuts damage the former far more.
#
#   distill: uv run python main.py distill --config configs/qwen3/depth14.yaml

model:
  backend: qwen3
  num_hidden_layers: 14 # halves every per-layer FHE cost

  softmax: exact # exact ops on purpose — isolate the cost of depth
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  beta: 1.0
  # Removes teacher layers 6-19. ⚠️ Picked by the zero-training block scan, which trained testing at
  # depth 19 later refuted — the exact middle (7-20 here) beat every scanned alternative. This map is
  # one block early, worth maybe ~0.5 pt by the depth-19 shift cost; the recorded 0.8140 used it.
  hidden_layer_map: [0, 1, 2, 3, 4, 5, 20, 21, 22, 23, 24, 25, 26, 27]
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 24000
  output_dir: outputs
  run_name: qwen3_depth14
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32 # standard recipe (fidelity-verified against fp32 at depth 24)

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5 # sqrt scaling for bs32; must match the other depth runs or the comparison breaks
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
