# Depth 11, exact ops — 61% of layers removed, once believed to be past a cliff.
#
# The zero-training init curve collapses below depth 11 for any map (init here is just 0.3922), which
# had been recorded as a capacity limit. RESULT: recall@10 0.7856, STS-B 0.8264 (-5.3% relative), i.e.
# right on the same ~0.9-points-per-layer line as every milder cut. The "collapse" describes strided
# INITIALIZATION, not an 11-layer network's capacity.
#
#   distill: uv run python main.py distill --config configs/qwen3/depth11.yaml

model:
  backend: qwen3
  num_hidden_layers: 11

  softmax: exact # exact ops on purpose — isolate the cost of depth
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  beta: 1.0
  # Remove teacher layers 5-21 — measured best of all 12 positions (init recall@10 0.3922). Here the
  # best block IS the middle, unlike depth 14 (6-19) and 19 (12-20). Beyond 3-19..5-21 quality falls
  # off hard in both directions, so at this depth the map is nearly forced.
  hidden_layer_map: [0, 1, 2, 3, 4, 22, 23, 24, 25, 26, 27]
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 24000 # 750 steps/epoch at batch 32
  output_dir: outputs
  run_name: qwen3_depth11
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
