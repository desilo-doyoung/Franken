# Depth 19, UNIFORM STRIDE — the repo default, trained for the first time.
#
# Every "stride is 4-6x worse than drop-middle" number in PROGRESS is a ZERO-TRAINING measurement
# (init recall@10 0.0772 vs 0.5964). That evidence is now suspect: at this same depth the block scan
# ranked 12-20 above 9-17 by +3.6 init points and the trained order came out reversed, so init does
# not predict trained quality. Striding is also what DistilBERT does and what this repo's BERT 12->8
# work used successfully, so the literature disagrees with our init curve.
#
# Removes every 3rd teacher layer (1, 4, 7, ..., 25), keeping 0 and 27. If this lands near the
# drop-middle runs (~0.85), the whole block-scan apparatus is unnecessary and the default was fine.
#
#   distill: uv run python main.py distill --config configs/qwen3/depth19_stride.yaml

model:
  backend: qwen3
  num_hidden_layers: 19

  softmax: exact
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  beta: 1.0
  # Identical to `hidden_layer_map: null` at this depth (resolve_layer_map's uniform_stride);
  # written out so the experiment is legible and cannot silently change with the default.
  hidden_layer_map: [0, 2, 3, 5, 6, 8, 9, 11, 12, 14, 15, 17, 18, 20, 21, 23, 24, 26, 27]
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 24000
  output_dir: outputs
  run_name: qwen3_depth19_stride
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 2.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
