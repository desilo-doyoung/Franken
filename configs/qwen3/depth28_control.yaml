# CONTROL for every depth experiment: full depth 28, exact ops, identical recipe.
#
# Nothing is removed and the ops are exact, so the student starts AS the teacher and has nothing to
# learn. Whatever it loses is therefore pure training-induced drift, to be subtracted from the
# reduced-depth runs. RESULT: recall@10 0.9648, STS-B 0.8739 (+0.1%) => drift costs 3.5% of recall and
# 0% of STS-B, which is what makes STS-B the clean depth-attribution channel.
#
#   distill: uv run python main.py distill --config configs/qwen3/depth28_control.yaml

model:
  backend: qwen3
  num_hidden_layers: 28 # full depth: the control

  softmax: exact
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  beta: 1.0
  hidden_layer_map: null # identity at full depth
  range_penalty: 0.0

train:
  teacher_model: Qwen/Qwen3-Embedding-0.6B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  corpus_size: 24000 # same budget as the depth-24 long runs
  output_dir: outputs
  run_name: qwen3_depth28_control
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: tf32 # standard recipe, verified to reproduce fp32 exactly at depth 24

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    # Must match the reduced-depth runs exactly, or the measured drift won't be the drift
    # those runs actually experienced. Drift goes as lr*sqrt(steps), so this recipe carries
    # ~3.5x the drift of the 750-step smoke run that already cost 3.8% recall.
    lr: 2.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01
