# Config for franken.scripts.precision_gate on the llama backend: asserts the residual stream
# stays fp32 under bf16 autocast (all 17 hidden entries, plus RoPE cos/sin), which is what makes
# bf16 safe for the hidden-MSE term. Full depth + exact ops, so the student is the teacher.
#
# The assertion is about dtypes, not data, so the corpus here only has to exist.

model:
  backend: llama
  num_hidden_layers: 16

  softmax: exact
  softmax_kwargs: {}
  activation: silu
  activation_kwargs: {}

distill:
  beta: 1.0
  hidden_layer_map: null # identity at full depth
  range_penalty: 0.0

train:
  teacher_model: unsloth/Llama-3.2-1B
  teacher_ckpt: null
  task: embed
  corpus: mixed
  tokens_per_epoch: 140_000
  output_dir: outputs
  run_name: llama_gate_precision
  max_seq_len: 128
  seed: 42
  device: cuda
  precision: bf16
  compile: false

  teacher:
    lr: 5.0e-5
    epochs: 3
    batch_size: 32
    warmup_ratio: 0.1
    weight_decay: 0.01

  distill:
    lr: 1.0e-5
    epochs: 3
    batch_size: 4
    warmup_ratio: 0.1
    weight_decay: 0.01
